[package]
name = "click-cli"
version = "0.2.5"
edition = "2024"
repository = "https://github.com/vercelclick/cli"
authors = ["Vercel Click Vault", "Billcountry Mwaniki"]
description = "Click uses passkeys to encrypt and decrypt secrets on your device offering a Just In Time secret injection model. Encrypted secrets are stored in your codebase or on a our hosted vault service."
homepage = "https://vercel.click"

[[bin]]
name = "click"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
click-local = { path = "../core/local" }
[profile.release]
opt-level = "z"
lto = "thin"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
