name: Click Vault Github
description: Install click-cli and export secrets to $GITHUB_ENV

on:
  workflow_call:
    inputs:
      access-key:
        required: true
        type: string
        description: "Set a standard or federated access key to use to decrypt secrets"
      environment:
        required: true
        type: string

jobs:
  inject-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Install Click cli
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/vercelclick/cli/releases/download/0.2.7/click-cli-installer.sh | sh

      - name: Inject secrets to Github env
        run: click export --access-key ${{ inputs.access-key }} --env ${{ inputs.environment }} --format github-actions >> $GITHUB_ENV
